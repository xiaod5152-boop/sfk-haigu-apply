<!DOCTYPE html>
<html lang="zh-CN" data-build="fair-cos-1445">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>本场企业 · 服务通知</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: #EDEDED;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px 12px 40px;
    color: #1A1A1A;
  }
  .phone {
    position: relative;
    width: 390px;
    height: 844px;
    background: #EDEDED;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 10px 40px rgba(0,0,0,.1);
  }
  .status {
    height: 44px; background: #EDEDED;
    display: flex; align-items: flex-end; justify-content: space-between;
    padding: 0 16px 6px; font-size: 13px; font-weight: 600; flex-shrink: 0;
  }
  .phone.h5 .status { background: #fff; }
  .nav {
    height: 44px; display: flex; align-items: center;
    justify-content: center; font-size: 16px; font-weight: 600;
    position: relative; flex-shrink: 0;
  }
  .wx-nav { background: #EDEDED; }
  .wx-nav .back, .nav .back {
    position: absolute; left: 10px; border: 0; background: none;
    font-size: 22px; cursor: pointer; color: #111;
  }
  .wx-nav .more {
    position: absolute; right: 14px; border: 0; background: none;
    font-size: 18px; font-weight: 800; letter-spacing: 2px; cursor: pointer;
  }
  .h5-nav {
    background: #fff;
    border-bottom: 1px solid #F0F0F0;
  }
  .h5-nav .ch-tag {
    display: none;
  }
  .h5-nav.long {
    height: 52px;
    font-size: 12px;
    flex-direction: column;
    justify-content: center;
    gap: 2px;
  }
  .h5-nav.long .ch-tag { display: inline-block; }
  .ch-tag {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .4px;
    border-radius: 4px;
    padding: 1px 6px;
    line-height: 1.4;
    background: #EEF2FF;
    color: #4338CA;
  }
  body.inner-ch .ch-tag { background: #FFF0F6; color: #C2186A; }
  .nav .cap {
    position: absolute; right: 12px; width: 84px; height: 30px;
    border: 1px solid #E5E5E5; border-radius: 15px;
  }
  .screen { display: none; flex: 1; overflow-x: hidden; overflow-y: auto; }
  .screen.on { display: block; }

  .wx-time {
    text-align: center;
    font-size: 12px;
    color: #B1B1B1;
    padding: 8px 0 12px;
  }
  .wx-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 0 16px 20px;
  }
  .wx-ava {
    width: 40px;
    height: 40px;
    border-radius: 6px;
    background: #07C160;
    color: #fff;
    font-size: 11px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    line-height: 1.15;
    flex-shrink: 0;
  }
  .wx-card {
    flex: 1;
    background: #fff;
    border-radius: 8px;
    overflow: hidden;
    text-align: left;
    border: 0;
    font: inherit;
    cursor: pointer;
    box-shadow: 0 1px 0 rgba(0,0,0,.04);
  }
  .wx-card header {
    padding: 12px 14px 8px;
    border-bottom: 1px solid #F4F4F4;
  }
  .wx-card header b {
    display: block;
    font-size: 16px;
    font-weight: 800;
    color: #111;
  }
  .wx-card header span {
    display: block;
    margin-top: 4px;
    font-size: 12px;
    color: #888;
    line-height: 1.45;
  }
  .wx-card dl {
    padding: 10px 14px 8px;
  }
  .wx-card div.row {
    display: flex;
    gap: 10px;
    padding: 5px 0;
    font-size: 13px;
    line-height: 1.45;
  }
  .wx-card dt {
    width: 42px;
    flex-shrink: 0;
    color: #999;
  }
  .wx-card dd { color: #333; font-weight: 600; }
  .wx-card footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px 12px;
    border-top: 1px solid #F4F4F4;
    font-size: 13px;
    font-weight: 700;
    color: #07C160;
  }
  .wx-card footer i { font-style: normal; color: #C8C8C8; font-weight: 400; }
  .wx-hint {
    margin: 0 16px;
    font-size: 11px;
    color: #B1B1B1;
    text-align: center;
    line-height: 1.5;
  }

  .h5-body { padding: 12px 16px 28px; background: #F7F8FA; min-height: 100%; }
  body.inner-ch .phone.h5 { background: #fff; }
  body.inner-ch .h5-body { background: #fff; }
  .cos-tip {
    margin: 0 0 10px;
    padding: 8px 10px;
    font-size: 11px;
    font-weight: 600;
    color: #888;
    line-height: 1.5;
    background: #F7F8FA;
    border-radius: 10px;
  }
  body.inner-ch .cos-tip { background: #F7F8FA; }
  .cos-meta {
    margin: 0 0 10px;
    font-size: 13px;
    font-weight: 800;
    color: #111;
  }
  .cos-list { display: flex; flex-direction: column; gap: 8px; }
  .cos-card {
    display: block;
    width: 100%;
    text-align: left;
    padding: 12px;
    border: 1px solid #EEEFF4;
    border-radius: 12px;
    background: #fff;
    font: inherit;
    cursor: pointer;
  }
  .cos-card strong {
    display: block;
    font-size: 14px;
    font-weight: 800;
    color: #111;
  }
  .cos-card em {
    display: block;
    margin-top: 4px;
    font-style: normal;
    font-size: 11px;
    font-weight: 600;
    color: #888;
  }
  .cos-detail h3 {
    margin: 0 0 6px;
    font-size: 17px;
    font-weight: 900;
    color: #111;
  }
  .cos-detail .tag {
    margin: 0 0 12px;
    font-size: 12px;
    font-weight: 600;
    color: #888;
  }
  .cos-detail h4 {
    margin: 14px 0 6px;
    font-size: 13px;
    font-weight: 800;
    color: #4338CA;
  }
  body.inner-ch .cos-detail h4 { color: #C2186A; }
  .cos-detail p {
    margin: 0 0 8px;
    font-size: 12px;
    font-weight: 500;
    color: #444;
    line-height: 1.7;
  }
</style>
</head>
<body>
<div class="phone" id="phone">
  <div class="status"><span>10:28</span><span>5G</span></div>
  <div class="nav wx-nav" id="navWx">
    <button class="back" id="backWx" type="button">‹</button>
    <span>服务通知</span>
    <button class="more" type="button" tabindex="-1">···</button>
  </div>
  <div class="nav h5-nav long" id="navH5" hidden>
    <button class="back" id="backH5" type="button">‹</button>
    <span class="ch-tag" id="chTag">内部通道</span>
    <span id="navTitle">本场企业</span>
    <span class="cap"></span>
  </div>

  <section class="screen on" id="wx">
    <p class="wx-time">下午 2:16</p>
    <div class="wx-row">
      <div class="wx-ava">服务<br>通知</div>
      <button class="wx-card" id="wxCard" type="button">
        <header>
          <b>报名成功通知</b>
          <span>请按场次到场，点击查看本场企业介绍</span>
        </header>
        <dl>
          <div class="row"><dt>活动</dt><dd id="nTitle">中国海归艺术创意人才专场招聘会</dd></div>
          <div class="row"><dt>场次</dt><dd id="nCity">上海站</dd></div>
          <div class="row"><dt>时间</dt><dd id="nWhen">10月24日</dd></div>
          <div class="row"><dt>地点</dt><dd id="nAddr">上海市黄浦区南京东路100号国际饭店会议层</dd></div>
        </dl>
        <footer><span>查看本场企业</span><i>›</i></footer>
      </button>
    </div>
    <p class="wx-hint">仅报名本场学生可见，不对外展示</p>
  </section>

  <section class="screen" id="list">
    <div class="h5-body">
      <p class="cos-tip">来自微信服务通知 · 仅本场报名学生可见。本场约 10 家企业，介绍将按场次更新。</p>
      <p class="cos-meta" id="cosMeta"></p>
      <div class="cos-list" id="cosList"></div>
    </div>
  </section>

  <section class="screen" id="detail">
    <div class="h5-body cos-detail" id="cosDetail"></div>
  </section>
</div>
<script>
const INNER = (() => {
  const q = new URLSearchParams(location.search);
  const hash = (location.hash || "").replace(/^#/, "");
  if (q.get("pub") === "1" || q.get("inner") === "0" || hash === "pub") return false;
  if (q.has("inner") && q.get("inner") !== "false") return true;
  return true;
})();
const VENUES = {
  北京: "北京市朝阳区酒仙桥路4号798艺术中心展厅",
  上海: "上海市黄浦区南京东路100号国际饭店会议层",
  广州: "广州市天河区天河路208号天河城酒店8层",
  成都: "成都市锦江区红星路三段1号成都国际饭店6层"
};
const FAIR_CITY_DATE = { 上海: "10月24日", 广州: "10月25日", 北京: "10月31日", 成都: "11月14日" };
const FAIR_CO_HRJZ = {
  id: "hrjz",
  name: "华润江中制药集团",
  tag: "中成药 · 保健食品",
  ready: true,
  sections: [
    {
      h: "企业介绍",
      ps: [
        "华润江中制药集团有限责任公司前身为1969年10月创立的江西中医药大学校办企业，2004年正式列为江西省省属国有重点企业。2019年2月，经华润医药战略重组后正式更名“华润江中”，成为华润集团一级利润中心，旗下拥有A股上市企业江中药业（股票代码：600750）。",
        "公司主营中成药、保健食品的研发、生产与销售，拥有成熟完整的中医药科研体系与两大现代化智能制造生产基地。企业坐拥“江中”“初元”两大中国驰名商标，以及“杨济生”“桑海”两大江西省著名商标。其中“江中”品牌连续17年入选世界品牌实验室“中国500最具价值品牌”，2020年品牌价值达265.15亿元。核心明星产品涵盖江中牌健胃消食片、复方草珊瑚含片、利活乳酸菌素片、初元氨基酸口服液、参灵草口服液等多款国民级健康产品，广泛覆盖大众日常健康养护场景。"
      ]
    },
    {
      h: "品牌创意、视觉传播类企业荣誉",
      ps: [
        "华润江中长期重视品牌视觉、产品包装、IP插画、线下终端空间美学建设，在品牌创意、视觉传播、工业空间设计领域斩获多项行业权威荣誉，同时拥有大量外观设计专利、美术著作权，搭建面向全国艺术设计专业青年的创意共创平台。",
        "企业创意项目《黄药师的“药”紧事》获得第八届中央企业优秀故事AIGC创意传播优秀奖；健胃消食片高校共创项目斩获ADMEN国际大赏实战金案，入选年度十大营销实战案例；在第31届中国国际广告节斩获“大学生喜爱的活力品牌”等多项创意传播大奖。",
        "华润江中连续多年担任中国大学生广告艺术节学院奖核心命题企业，面向视觉传达、环境设计、艺术设计类高校学生征集产品包装、平面海报、品牌IP形象、线下门店终端视觉等方向创意作品，累计收到数万组青年设计作品，企业内部设计团队全程参与命题策划、作品评审，推动青年设计创意与品牌实际业务落地结合。",
        "企业自主完成多款产品包装、品牌IP形象视觉开发，持有多项包装盒外观设计专利、猴姑系列IP美术著作权，实现包装版式、色彩、造型全流程自主设计。"
      ]
    },
    {
      h: "空间/环境美学相关",
      ps: [
        "旗下2800亩江中药谷制造基地，融合中式自然美学与工业建筑规划，厂区建筑、景观、导视系统一体化设计，获评“最美中国工厂”国家级绿色工厂，是国内工业空间环境设计的标杆项目。"
      ]
    }
  ]
};
function fairCosPending(n) {
  return { id: "slot-" + n, name: "本场席位 " + String(n).padStart(2, "0"), tag: "介绍待录入", ready: false, sections: [] };
}
const FAIR_SESSION_COS = {
  上海: [FAIR_CO_HRJZ].concat([2,3,4,5,6,7,8,9,10].map(fairCosPending)),
  广州: [FAIR_CO_HRJZ].concat([2,3,4,5,6,7,8,9,10].map(fairCosPending)),
  北京: [FAIR_CO_HRJZ].concat([2,3,4,5,6,7,8,9,10].map(fairCosPending)),
  成都: [FAIR_CO_HRJZ].concat([2,3,4,5,6,7,8,9,10].map(fairCosPending))
};
const q = new URLSearchParams(location.search);
const CITY = ["北京", "上海", "广州", "成都"].includes(q.get("city")) ? q.get("city") : "上海";
const SKIP_WX = q.get("from") === "apply" || q.get("page") === "list";

function escHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;"
  }[c]));
}
function setMode(h5) {
  document.getElementById("phone").classList.toggle("h5", h5);
  document.getElementById("navWx").hidden = h5;
  document.getElementById("navH5").hidden = !h5;
}
function show(id, title) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("on"));
  document.getElementById(id).classList.add("on");
  setMode(id !== "wx");
  if (title) document.getElementById("navTitle").textContent = title;
  show.id = id;
}
function paintNotice() {
  document.getElementById("nCity").textContent = CITY + "站";
  document.getElementById("nWhen").textContent = FAIR_CITY_DATE[CITY] || "";
  document.getElementById("nAddr").textContent = VENUES[CITY] || "";
}
function paintList() {
  const list = FAIR_SESSION_COS[CITY] || FAIR_SESSION_COS["上海"];
  document.getElementById("cosMeta").textContent =
    CITY + "站 · " + (FAIR_CITY_DATE[CITY] || "") + " · " + list.length + " 家企业";
  document.getElementById("cosList").innerHTML = list.map(item =>
    "<button type=\"button\" class=\"cos-card\" data-co=\"" + escHtml(item.id) + "\">" +
      "<strong>" + escHtml(item.name) + "</strong>" +
      "<em>" + escHtml(item.tag || "介绍待录入") + "</em>" +
    "</button>"
  ).join("");
}
function paintDetail(id) {
  const list = FAIR_SESSION_COS[CITY] || FAIR_SESSION_COS["上海"];
  const item = list.find(x => x.id === id) || list[0];
  const body = item.ready
    ? item.sections.map(sec =>
        "<h4>" + escHtml(sec.h) + "</h4>" + sec.ps.map(p => "<p>" + escHtml(p) + "</p>").join("")
      ).join("")
    : "<p>该企业介绍待录入，报名后将按场次更新。</p>";
  document.getElementById("cosDetail").innerHTML =
    "<h3>" + escHtml(item.name) + "</h3>" +
    (item.tag ? "<p class=\"tag\">" + escHtml(item.tag) + "</p>" : "") +
    body;
  show("detail", item.name);
}

document.body.classList.add(INNER ? "inner-ch" : "pub-ch");
document.getElementById("chTag").textContent = INNER ? "内部通道" : "公开通道";
paintNotice();
paintList();
if (SKIP_WX) show("list", "本场企业");
else show("wx");

document.getElementById("wxCard").addEventListener("click", () => show("list", "本场企业"));
document.getElementById("cosList").addEventListener("click", e => {
  const card = e.target.closest("[data-co]");
  if (card) paintDetail(card.dataset.co);
});
document.getElementById("backWx").addEventListener("click", () => history.length > 1 && history.back());
document.getElementById("backH5").addEventListener("click", () => {
  if (show.id === "detail") {
    show("list", "本场企业");
    return;
  }
  if (!SKIP_WX) {
    show("wx");
    return;
  }
  if (history.length > 1) history.back();
});
</script>
</body>
</html>
